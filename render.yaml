services:
  - type: web
    name: yolo-model-detector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: WEIGHTS_DIR
        value: "."
